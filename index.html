:root{color-scheme:dark;--bg:#13121a;--ink:#f8f3ed;--muted:#aaa5b8;--accent:#c6b0f6;--line:#36313f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #f3d695;outline-offset:4px}[hidden]{display:none!important}.shell{max-width:1020px;margin:auto;padding:0 24px}.top{height:65px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:24px;letter-spacing:-1px}.brand span{color:var(--accent)}.private,.foot{font-size:11px;color:var(--muted)}.hero{padding:24px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:normal 36px/1.1 Georgia,serif;letter-spacing:-1px;margin:0 0 10px}p{color:var(--muted);margin:0 0 12px;font-size:13px}input{background:#1d1a25;border:1px solid #4b435a;border-radius:8px;padding:10px 12px;color:var(--ink);width:220px;max-width:100%;font-size:13px}.primary{background:var(--accent);border:0;color:#21172f;font-weight:750;border-radius:9px;padding:12px 20px}.secondary{background:transparent;border:1px solid #554b66;color:var(--ink);border-radius:9px;padding:11px 18px}.toolbar{padding:0 0 14px}.tabs{display:none}.count{color:var(--muted);font-size:12px}#sections{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.bingo-tile{position:relative;min-height:128px;padding:35px 10px 20px;background:#1e1c28;border:1px solid #3b3448;border-radius:8px;color:var(--ink);font-size:12px;line-height:1.4;transition:background .15s,border-color .15s,transform .15s;overflow-wrap:anywhere}.bingo-tile:hover{border-color:#a790d1;transform:translateY(-2px)}.bingo-tile[aria-pressed=true]{background:#c6b0f6;color:#21172f;border-color:#c6b0f6}.tile-mark{position:absolute;right:9px;top:9px;border:1px solid #6b607d;width:19px;height:19px;line-height:17px;border-radius:50%;font-size:13px}.bingo-tile[aria-pressed=true] .tile-mark{background:#21172f;color:#e4d2ff;border-color:#21172f}.bottom{display:flex;justify-content:flex-end;margin:22px 0 32px}.summary-head{padding-top:24px}.actions{display:flex;gap:10px;margin:18px 0}.summary-board{padding:12px;background:#191620;border:1px solid var(--line);border-radius:12px;margin-bottom:30px}canvas{display:block;width:100%;height:auto}.status{font-size:12px;color:var(--accent);margin-bottom:12px}.foot{border-top:1px solid var(--line);padding:20px 0}button:disabled{opacity:.5;cursor:default}@media(max-width:750px){#sections{grid-template-columns:repeat(4,minmax(0,1fr))}.shell{padding:0 16px}.bingo-tile{min-height:110px}}@media(max-width:420px){.shell{padding:0 12px}#sections{gap:5px}.bingo-tile{font-size:10px;min-height:112px;padding:31px 6px 12px}.hero{align-items:flex-start}.hero h1{font-size:30px}.hero .primary{font-size:12px;padding:10px;white-space:nowrap}input{width:175px}.tile-mark{right:7px;top:7px;width:16px;height:16px;font-size:11px;line-height:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">

<div id="sections"></div>
<div class="bottom"><button class="primary" id="previewBottom">Save image ↗</button></div>
</section>
<section id="summary" hidden>
<div class="summary-head"><h1>My bingo</h1></div>
<div class="actions"><button id="download" class="primary">Download PNG ↓</button><button id="back" class="secondary">← Edit</button></div><div id="downloadStatus" class="status" role="status"></div>
<div class="summary-board"><canvas id="canvas" role="img" aria-label="Your bingo board: done or not done"></canvas></div><div id="summaryText" class="grid" aria-label="Bingo selections in the image"></div>
</section>
</main><footer class="foot">Answers stay in this tab.</footer>
</div>

{name:'Fluids',color:'#c1a4f4',items:['Piss on my face','Piss on someone’s face','Swallow piss','Make someone swallow piss','Get cummed on by more than 2 at once','Cum on someone with others','Kiss with cum','Exchange spit']},

const $=id=>document.getElementById(id);
function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function show(id){['editor','summary'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0);const heading=$(id).querySelector('h1');heading.tabIndex=-1;heading.focus({preventScroll:true});}

function updateProgress(){$('progress').textContent=ratings.size+' / '+items.length+' done';}
function build(){
 items.forEach(({label,key})=>{const tile=element('button','bingo-tile');tile.type='button';tile.dataset.key=key;tile.setAttribute('aria-pressed','false');tile.setAttribute('aria-label',label);const mark=element('span','tile-mark');mark.setAttribute('aria-hidden','true');tile.append(mark,element('span','tile-label',label));tile.onclick=()=>{const done=!ratings.has(key);if(done)ratings.set(key,true);else ratings.delete(key);tile.setAttribute('aria-pressed',String(done));mark.textContent=done?'✓':'';updateProgress();};$('sections').append(tile);});updateProgress();
}
function wrap(ctx,text,max){const words=text.split(/\s+/);const lines=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>max&&line){lines.push(line);line=word;}else line=next;}if(line)lines.push(line);return lines;}

 $('summaryText').style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)';
}
function preview(){nickname=$('nickname').value.trim();drawSummary();show('summary');}
$('previewTop').onclick=preview;$('previewBottom').onclick=preview;$('back').onclick=()=>show('editor');
$('download').onclick=()=>{const button=$('download');button.disabled=true;$('canvas').toBlob(blob=>{button.disabled=false;if(!blob){$('downloadStatus').textContent='Could not create image. Please try again.';return;}const url=URL.createObjectURL(blob);const link=element('a');link.href=url;link.download='my-kink-bingo.png';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('downloadStatus').textContent='Image ready. Check your downloads.';},'image/png');};
build();
</script>
</body>
</html>
